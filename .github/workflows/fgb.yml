name: Revisar publicaciones FGB
on:
  push:
    branches: [main]
    paths:
      - 'check-fgb.py'
      - 'read-fgb-image.mjs'
      - 'docs/wage-parser.mjs'
      - 'docs/wages.json'
      - '.github/workflows/fgb.yml'
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar lector de cuadros
        run: npm install --ignore-scripts
      - name: Comprobar lector
        run: node tests/wage-parser.mjs
      - name: Revisar fuente pública
        run: python check-fgb.py
      - name: Guardar estado de la fuente
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/fgb-status.json docs/wages.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiza comprobación de la fuente FGB'
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
